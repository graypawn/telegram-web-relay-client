name: Package and publish dist

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  PUBLISH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.extract-version.outputs.package-version }}
      tag-name: ${{ steps.extract-version.outputs.tag-name }}
      release-name: ${{ steps.extract-version.outputs.release-name }}
      should-publish: ${{ steps.extract-version.outputs.should-publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version and release metadata
        id: extract-version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="client_v${PACKAGE_VERSION}"
          RELEASE_NAME="Telegram Relay Client v${PACKAGE_VERSION}"
          echo "package-version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag-name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release-name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-publish=" >> "$GITHUB_OUTPUT"
          fi

  check-version:
    runs-on: ubuntu-latest
    needs: get-version
    outputs:
      should-skip: ${{ steps.check-release.outputs.should-skip }}
      release-id: ${{ steps.check-release.outputs.release-id }}
      should-create-release: ${{ steps.check-release.outputs.should-create-release }}
    steps:
      - name: Check whether release already exists
        id: check-release
        env:
          TAG_NAME: ${{ needs.get-version.outputs.tag-name }}
          SHOULD_PUBLISH: ${{ needs.get-version.outputs.should-publish }}
        run: |
          if [ -z "$SHOULD_PUBLISH" ]; then
            echo "Publishing disabled (non-main branch)"
            echo "should-skip=false" >> "$GITHUB_OUTPUT"
            echo "should-create-release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RESPONSE=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$PUBLISH_REPO/releases?per_page=100")
          RELEASE=$(echo "$RESPONSE" | jq -c --arg tag "$TAG_NAME" \
            '[.[]? | select(.tag_name == $tag)] | first')

          if [ "$RELEASE" != "null" ]; then
            RELEASE_ID=$(echo "$RELEASE" | jq -r '.id')
            echo "release-id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
            if [ "$(echo "$RELEASE" | jq -r '.draft')" = "false" ]; then
              echo "Published release already exists for $TAG_NAME"
              echo "should-skip=true" >> "$GITHUB_OUTPUT"
              echo "should-create-release=false" >> "$GITHUB_OUTPUT"
            else
              echo "Reusing existing draft release for $TAG_NAME"
              echo "should-skip=false" >> "$GITHUB_OUTPUT"
              echo "should-create-release=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No release found for $TAG_NAME"
            echo "should-skip=false" >> "$GITHUB_OUTPUT"
            echo "should-create-release=true" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    runs-on: ubuntu-latest
    needs: [get-version, check-version]
    if: needs.get-version.outputs.should-publish != '' && needs.check-version.outputs.should-create-release == 'true'
    outputs:
      release-id: ${{ steps.create-release.outputs.release-id }}
    steps:
      - name: Create draft release
        id: create-release
        env:
          TAG_NAME: ${{ needs.get-version.outputs.tag-name }}
          RELEASE_NAME: ${{ needs.get-version.outputs.release-name }}
        run: |
          RESPONSE=$(curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"tag_name":"'"$TAG_NAME"'","name":"'"$RELEASE_NAME"'","draft":true}' \
            "https://api.github.com/repos/$PUBLISH_REPO/releases")
          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id')
          if [ "$RELEASE_ID" = "null" ]; then
            echo "$RESPONSE"
            exit 1
          fi
          echo "release-id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  package-dist:
    name: Build and package dist
    runs-on: ubuntu-22.04
    needs: [get-version, check-version, create-release]
    if: always() && needs.check-version.outputs.should-skip != 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '22' }}

      - name: Install dependencies
        run: npm ci

      - name: Build production client
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          test -n "$TELEGRAM_API_ID" || { echo "Missing TELEGRAM_API_ID repository secret" >&2; exit 1; }
          test -n "$TELEGRAM_API_HASH" || { echo "Missing TELEGRAM_API_HASH repository secret" >&2; exit 1; }
          npm run build:production

      - name: Create dist archive
        id: package
        env:
          PACKAGE_VERSION: ${{ needs.get-version.outputs.package-version }}
        run: |
          ARCHIVE="telegram-relay-client-${PACKAGE_VERSION}-dist.zip"
          (cd dist && zip -qr "../$ARCHIVE" .)
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-relay-client-dist
          path: ${{ steps.package.outputs.archive }}

      - name: Upload release asset
        if: needs.get-version.outputs.should-publish != ''
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release-id || needs.check-version.outputs.release-id }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          RESPONSE=$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary "@$ARCHIVE" \
            "https://uploads.github.com/repos/$PUBLISH_REPO/releases/$RELEASE_ID/assets?name=$ARCHIVE")
          echo "$RESPONSE" | jq -e '.browser_download_url' > /dev/null

  publish-release:
    runs-on: ubuntu-latest
    needs: [get-version, check-version, create-release, package-dist]
    if: needs.get-version.outputs.should-publish != '' && needs.check-version.outputs.should-skip != 'true'
    env:
      RELEASE_ID: ${{ needs.create-release.outputs.release-id || needs.check-version.outputs.release-id }}
    steps:
      - name: Publish release
        run: |
          curl -sS -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"draft":false}' \
            "https://api.github.com/repos/$PUBLISH_REPO/releases/$RELEASE_ID"
