name: Check Telegram-tt upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check upstream revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_SYNC_REPORT: ${{ runner.temp }}/telegram-tt-upstream-sync.md
        run: node scripts/check-telegram-tt-upstream.mjs

      - name: Upload upstream sync report
        uses: actions/upload-artifact@v4
        with:
          name: telegram-tt-upstream-sync
          path: ${{ runner.temp }}/telegram-tt-upstream-sync.md
